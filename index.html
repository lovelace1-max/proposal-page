<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Romantic Surprise</title>
    <style>
        /* Mobile-First, High-Perf Responsive Design */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none; /* Prevents mobile scrolling issues */
        }

        /* Canvas Background */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hearts, .stars {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart, .star {
            position: absolute;
            font-size: clamp(16px, 3vw, 24px);
            animation: float 6s ease-in-out infinite;
            opacity: 0;
            will-change: transform, opacity;
        }
        .star { color: #ffd700; animation-delay: -2s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(80vh) rotate(90deg) scale(1); }
            50% { transform: translateY(40vh) rotate(180deg) scale(1.5); }
            80% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg) scale(0); opacity: 0; }
        }

        .content {
            text-align: center;
            z-index: 2;
            color: #fff;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            animation: gentleFloat 8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.5));
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: clamp(2.5em, 8vw, 4.5em);
            margin: 10px 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 4s ease infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Dynamic Text Container */
        .dynamic-text-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        p {
            font-size: clamp(1.2em, 4vw, 1.4em);
            line-height: 1.5;
            opacity: 0.9;
            transition: opacity 0.5s ease;
        }

        .love-meter {
            width: 80%; height: 25px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            margin: 25px auto;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(255,0,0,0.3);
        }

        .love-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff69b4, #ffd700);
            width: 0%;
            animation: fillLove 5s ease-out forwards;
            border-radius: 15px;
        }

        @keyframes fillLove { to { width: 100%; } }

        .compliment {
            font-size: clamp(1em, 3.5vw, 1.2em);
            padding: 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin: 15px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { box-shadow: 0 0 5px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 20px rgba(255,105,180,0.6); }
        }

        /* Modal */
        .modal {
            display: none; /* Changed via JS */
            position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255,107,107,0.95), rgba(78,205,196,0.95));
            padding: clamp(30px, 8vw, 50px);
            border-radius: 30px;
            text-align: center; color: white;
            width: 95%; max-width: 450px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            animation: modalPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        @keyframes modalPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h2 { font-size: clamp(2.2em, 7vw, 3em); margin: 20px 0; animation: glowPulse 2s infinite; }
        
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
            50% { text-shadow: 0 0 30px rgba(255,255,255,1), 0 0 40px rgba(255,105,180,0.8); }
        }

        .embarrassing-text {
            font-size: clamp(1.1em, 4vw, 1.3em);
            margin: 20px 0; font-style: italic;
            height: 80px; /* fixed height to prevent jumping */
            display: flex; align-items: center; justify-content: center;
        }

        .btn-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

        .yes-btn {
            background: linear-gradient(45deg, #ffeb3b, #ffc107);
            color: #d32f2f; border: none;
            padding: 15px 30px; font-size: clamp(1.2em, 5vw, 1.5em);
            border-radius: 50px; cursor: pointer; font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            flex: 1; min-width: 120px;
        }
        .yes-btn:active { transform: scale(0.9); }

        /* Victory */
        .victory {
            display: none; position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 25px;
            color: #e91e63; z-index: 1002;
            text-align: center; width: 90%; max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: victoryPop 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes victoryPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .dance-emoji { font-size: clamp(3em, 10vw, 4em); display: block; margin-bottom: 15px; }

        /* Effects */
        .confetti { position: fixed; pointer-events: none; z-index: 1001; animation: confettiFall linear forwards; }
        @keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="hearts" id="hearts"></div>
    <div class="stars" id="stars"></div>

    <div class="content">
        <h1>I love you Miss. Lalo 💖</h1>
        
        <div class="dynamic-text-container">
            <p id="cuteMessage">"You're cuter than a baby elephant in sunglasses! 🐘😎"</p>
        </div>

        <div class="love-meter">
            <div class="love-fill"></div>
        </div>
        <div class="compliment">Miss. Bhoomi Sharma (Rana)!</div>
    </div>

    <div id="proposalModal" class="modal">
        <div class="modal-content">
            <h2>Will You Marry Me? 💍</h2>
            <div class="embarrassing-text">
                <span id="threatMessage">"P.S. If no, I'll embarrass you with infinite talk forever! 🕺💃"</span>
            </div>
            <div class="btn-container">
                <button class="yes-btn" onclick="acceptProposal()">YES!</button>
                <button class="yes-btn" onclick="acceptProposal()">YESS!!</button>
            </div>
        </div>
    </div>

    <div id="victory" class="victory">
        <div class="dance-emoji">🎉🥳💃🕺</div>
        <h2>I always miss you so much. ❤️</h2>
    </div>

    <script>
        // --- 1. Dynamic Rotating Texts ---
        const cuteMessages = [
            "You're cuter than a baby elephant in sunglasses! 🐘😎",
            "Your laugh is my favorite playlist on repeat! 🎶😄",
            "I'd share my blanket with you... that's TRUE LOVE! 🥟❤️",
            "You turn my 'oops' into 'yay!' every day! ✨🤗"
        ];
        
        const threats = [
            "P.S. If no, I'll embarrass you with infinite talk forever! 🕺💃",
            "Imagine after marriage: 5 babies in glasses calling you mamma! 😅👰",
            "Say yes, or I'll lift you and make you for WDS! 🎤🙈",
            "You're blushing already? AWWWWWWWWWW! 😜🎂"
        ];

        function rotateText(elementId, array, interval) {
            let index = 0;
            const el = document.getElementById(elementId);
            setInterval(() => {
                el.style.opacity = 0; // Fade out
                setTimeout(() => {
                    index = (index + 1) % array.length;
                    el.innerText = array[index];
                    el.style.opacity = 1; // Fade in
                }, 500); // Wait for fade out
            }, interval);
        }

        rotateText('cuteMessage', cuteMessages, 4000);
        rotateText('threatMessage', threats, 3500);

        // --- 2. Smooth Canvas Background & Mouse Trails ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let pointer = { x: -100, y: -100 }; // Starts off-screen
        let particles = [];
        let trailParticles = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
        window.addEventListener('touchmove', e => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; });

        // Nebula Stars
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                vx: Math.random() * 0.5 - 0.25,
                vy: Math.random() * 0.5 - 0.25,
                hue: Math.random() * 360
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Nebula
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                p.hue += 0.5;
                ctx.fillStyle = `hsla(${p.hue}, 70%, 70%, 0.3)`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });

            // Draw Smooth Mouse Trail
            if (pointer.x > 0 && Math.random() < 0.4) {
                trailParticles.push({
                    x: pointer.x, y: pointer.y,
                    size: Math.random() * 4 + 2,
                    life: 1,
                    vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1
                });
            }

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                let p = trailParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02; // Fade out
                if (p.life <= 0) {
                    trailParticles.splice(i, 1);
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "pink";
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; // Reset
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // --- 3. Floating Emojis ---
        function createEmoji(containerId, emojis) {
            const container = document.getElementById(containerId);
            const elem = document.createElement('div');
            elem.className = containerId.slice(0, -1); // 'hearts' -> 'heart'
            elem.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            elem.style.left = Math.random() * 100 + 'vw';
            elem.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(elem);
            setTimeout(() => elem.remove(), 6000);
        }

        setInterval(() => createEmoji('hearts', ['💖', '💕', '💗', '🌹']), 500);
        setInterval(() => createEmoji('stars', ['⭐', '✨', '🌟']), 800);

        // --- 4. Game Logic ---
        function showModal() {
            document.getElementById('proposalModal').style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(300);
        }

        function acceptProposal() {
            document.getElementById('proposalModal').style.display = 'none';
            showMegaCelebration();
        }

        function showMegaCelebration() {
            // High-perf Confetti Generation
            const colors = ['#ff6b6b', '#4ecdc4', '#ffeaa7', '#a29bfe'];
            for (let i = 0; i < 80; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -20 + 'px';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 20 + 10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }

            document.getElementById('victory').style.display = 'block';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            
            // Re-open modal loop if desired, or let them stare at victory!
            setTimeout(() => {
                document.getElementById('victory').style.display = 'none';
                showModal(); 
            }, 8000);
        }

        // Trigger the proposal shortly after the page loads
        window.onload = () => {
            setTimeout(showModal, 4500); 
        };
    </script>
</body>
</html>
